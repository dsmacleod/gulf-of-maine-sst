name: Update SST data

on:
  schedule:
    # Run daily at 10:00 UTC (5–6 AM Eastern)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download latest Gulf of Maine SST data
        run: |
          curl -sf "https://climatereanalyzer.org/clim/sst_daily/json_2clim/oisst2.1_gom_sst_day.json" \
            -A "Mozilla/5.0" \
            -o gom_sst.json

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gom_sst.json
          git diff --cached --quiet || git commit -m "Update SST data $(date -u +%Y-%m-%d)" && git push
